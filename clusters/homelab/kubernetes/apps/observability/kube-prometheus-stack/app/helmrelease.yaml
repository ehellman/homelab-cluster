# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.2.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  # CRD handling: Create if missing, Replace if exists (for upgrades)
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3

  values:
    crds:
      enabled: true
    # Use cleaner names without random suffixes (e.g., "prometheus" not "prometheus-kube-prometheus-stack")
    cleanPrometheusOperatorObjectNames: true

    # ============================================================================
    # GRAFANA
    # ============================================================================
    # Disabled here - we deploy Grafana separately for more control and independent upgrades.
    # forceDeployDashboards: still creates ConfigMaps with dashboards that Grafana's
    # sidecar will pick up automatically.
    grafana:
      enabled: false
      forceDeployDashboards: true

    # ============================================================================
    # ALERTMANAGER
    # ============================================================================
    # Handles alert routing and notifications (email, Slack, PagerDuty, etc.)
    # 2 replicas for HA - they form a cluster and deduplicate alerts.
    alertmanager:
      enabled: true
      # Notification routing. The chart default root route points at the built-in
      # "null" receiver, so every alert notifies nobody. We define the full route
      # tree inline (global routing catches cluster-wide alerts regardless of
      # namespace) and send all real alerts to Pushover.
      config:
        global:
          resolve_timeout: 5m
        # Suppress lower-severity alerts when a higher-severity one for the same
        # alert/namespace is already firing (kube-prometheus-stack defaults).
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal: ['namespace', 'alertname']
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal: ['namespace', 'alertname']
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal: ['namespace']
        route:
          group_by: ['namespace', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: pushover
          routes:
            # Deadman's-switch and info inhibitor must NOT page - route to null.
            - receiver: 'null'
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
            # Page critical alerts with Pushover high priority.
            - receiver: pushover-critical
              matchers:
                - severity = "critical"
        receivers:
          - name: 'null'
          - name: pushover
            pushover_configs:
              - token_file: /etc/alertmanager/secrets/alertmanager-pushover/token
                user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user-key
                priority: '0'
                send_resolved: true
                title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
                message: |-
                  {{ range .Alerts }}{{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  {{ end }}
          - name: pushover-critical
            pushover_configs:
              - token_file: /etc/alertmanager/secrets/alertmanager-pushover/token
                user_key_file: /etc/alertmanager/secrets/alertmanager-pushover/user-key
                priority: '1'
                send_resolved: true
                title: '{{ .CommonLabels.alertname }} ({{ .Status }})'
                message: |-
                  {{ range .Alerts }}{{ .Annotations.summary }}
                  {{ .Annotations.description }}
                  {{ end }}
      alertmanagerSpec:
        replicas: 2
        # Mount the Pushover credentials Secret at
        # /etc/alertmanager/secrets/alertmanager-pushover/<key> for token_file /
        # user_key_file above. The Secret is created by an ExternalSecret.
        secrets:
          - alertmanager-pushover
        # Persistent storage for silences and notification state
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 1Gi

    # ============================================================================
    # PROMETHEUS
    # ============================================================================
    # Time-series database that scrapes and stores metrics.
    # 2 replicas for HA - each scrapes independently (no data loss if one fails).
    prometheus:
      enabled: true
      prometheusSpec:
        replicas: 2
        # How long to keep data (whichever limit is hit first wins)
        retention: 14d
        retentionSize: 45GB
        # Compress write-ahead log to save disk space
        walCompression: true
        # Enable admin API for snapshots, deleting series, etc.
        enableAdminAPI: true

        # IMPORTANT: These settings make Prometheus discover ALL ServiceMonitors,
        # PodMonitors, ProbeConfigs, and ScrapeConfigs cluster-wide, not just
        # ones labeled for this specific helm release. This is what you want
        # for a cluster-wide monitoring setup.
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false

        # Persistent storage for metrics data
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 50Gi
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

    # ============================================================================
    # EXPORTERS
    # ============================================================================
    # node-exporter: Runs on every node, exposes hardware/OS metrics
    # (CPU, memory, disk, network, filesystem)
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      prometheus:
        monitor:
          enabled: true

    # kube-state-metrics: Exposes Kubernetes object state as metrics
    # (pod status, deployment replicas, node conditions, etc.)
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      prometheus:
        monitor:
          enabled: true

    # ============================================================================
    # KUBERNETES COMPONENT MONITORING
    # ============================================================================
    # These scrape metrics from Kubernetes control plane components.
    # Note: Some may need extra config depending on your cluster setup.
    kubeApiServer:
      enabled: true
    kubeControllerManager:
      enabled: true
    kubeScheduler:
      enabled: true
    kubeEtcd:
      enabled: true
    kubelet:
      enabled: true
    coreDns:
      enabled: true

    # Disabled: We use Cilium with eBPF which replaces kube-proxy entirely.
    # No kube-proxy pods are running, so nothing to scrape.
    kubeProxy:
      enabled: false
