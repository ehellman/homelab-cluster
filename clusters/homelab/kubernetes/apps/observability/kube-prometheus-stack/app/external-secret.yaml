# Pushover credentials for Alertmanager notifications, pulled from 1Password.
# Mounted into Alertmanager via alertmanagerSpec.secrets and referenced by the
# pushover_config token_file / user_key_file fields.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: alertmanager-pushover
    template:
      engineVersion: v2
      data:
        token: "{{ .token }}"
        user-key: "{{ .user_key }}"
  data:
    - secretKey: token
      remoteRef:
        key: pushover
        property: token
    - secretKey: user_key
      remoteRef:
        key: pushover
        property: user_key
