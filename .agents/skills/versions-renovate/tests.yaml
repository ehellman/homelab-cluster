version: 1
skill: versions-renovate
description: "Verify inline version placement, annotation syntax, datasource selection, and automerge scope"
tests:
  - id: VER-01
    description: "Knows versions are pinned inline — there is no versions.env in this repo"
    category: constraint
    severity: critical
    prompt: |
      Where do I add the pinned version for a new Helm chart in this repo?
    scoring:
      mode: keywords
      keywords:
        required: ["spec.chart.spec.version"]
        any_of: ["inline", "OCIRepository", "spec.ref.tag", "HelmRelease"]
        forbidden: ["versions.env", "kubernetes/platform"]
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Must point at the inline location (HelmRelease spec.chart.spec.version, or
      OCIRepository spec.ref.tag for OCI charts). Must NOT invent a versions.env or a
      kubernetes/platform directory — neither exists in this repo.
    tags:
      - versions-renovate-skill

  - id: VER-02
    description: "Uses datasource=docker (not helm) for OCI registries, no oci:// prefix"
    category: constraint
    severity: critical
    prompt: |
      I need Renovate to track the app-template chart at oci://ghcr.io/bjw-s-labs/helm/app-template.
      How should that be annotated?
    scoring:
      mode: keywords
      keywords:
        required: ["datasource=docker", "ghcr.io/bjw-s-labs/helm/app-template"]
        forbidden: ["datasource=helm"]
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Must use datasource=docker for OCI Helm registries, with the oci:// prefix stripped from
      depName. Using datasource=helm for OCI causes Renovate to fail silently. Bonus if it notes
      the repo already auto-detects bare oci://<image>:<tag> via a custom manager, so an explicit
      annotation is often unnecessary.
    tags:
      - versions-renovate-skill

  - id: VER-03
    description: "Annotation must appear on the line immediately above the value"
    category: constraint
    severity: high
    prompt: |
      I wrote a Renovate annotation but it's two lines above the version value with a blank line
      between them. Will this work?
    scoring:
      mode: keywords
      keywords:
        required: ["immediately above"]
        any_of: ["silently", "ignored", "not work", "regex"]
        forbidden: []
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Must state that the annotation has to sit on the line immediately above the key: value
      (or KEY=value) line. A blank line breaks the regex match and Renovate silently skips it.
    tags:
      - versions-renovate-skill

  - id: VER-04
    description: "Uses repository= (not registryUrl=) for the Helm repo URL"
    category: constraint
    severity: high
    prompt: |
      Annotate a Helm chart version so Renovate tracks cert-manager from https://charts.jetstack.io.
    scoring:
      mode: keywords
      keywords:
        required: ["datasource=helm", "depName=cert-manager", "repository=https://charts.jetstack.io"]
        forbidden: ["registryUrl="]
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      This repo's custom regex manager captures the repo URL from `repository=`, not
      `registryUrl=`. Using registryUrl= means the annotation is silently skipped.
    tags:
      - versions-renovate-skill

  - id: VER-05
    description: "Knows automerge is limited to github-actions and mise"
    category: constraint
    severity: high
    prompt: |
      If I merge a Renovate PR bumping a container image, will minor and patch updates
      automerge from now on?
    scoring:
      mode: keywords
      keywords:
        any_of: ["github-actions", "mise", "not automerge", "no automerge", "manual"]
        forbidden: []
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      Must say container images do NOT automerge. Only two packageRules enable automerge:
      github-actions (minor/patch/digest, after minimumReleaseAge 3 days) and mise
      (minor/patch). Everything else opens a PR for manual review.
    tags:
      - versions-renovate-skill

  - id: VER-06
    description: "Cites the correct Renovate config path"
    category: coverage
    severity: medium
    prompt: |
      Which file do I edit to add a Renovate package rule in this repo?
    scoring:
      mode: keywords
      keywords:
        required: [".renovaterc.json5"]
        forbidden: [".github/renovate.json5"]
    expect_refusal: false
    manual_review: false
    expected_behavior: |
      The Renovate config lives at .renovaterc.json5 in the repo root.
      .github/renovate.json5 does not exist here.
    tags:
      - versions-renovate-skill
